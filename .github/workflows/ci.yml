name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: taipei-ride-static
          path: dist
  browser:
    name: WebGL browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, portrait, landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install official Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Install Traditional Chinese screenshot fonts
        run: node tests/browser/install-ci-font.mjs
      - name: Run live WebGL browser tests
        run: npm run test:browser -- --project=${{ matrix.project }} tests/browser/game.spec.mjs tests/browser/menu.spec.mjs tests/browser/interface.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-webgl-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-screenshots-${{ matrix.project }}
          path: test-results/**/*.png
          retention-days: 14
  models:
    name: WebGL production model inspection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/install-ci-font.mjs
      - name: Render the production meshes through actual WebGL
        run: npm run test:browser -- --project=desktop tests/browser/models.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-webgl-models
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-screenshots-models
          path: test-results/**/*.png
          retention-days: 14
  contacts:
    name: WebGL runtime collision contacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/install-ci-font.mjs
      - name: Exercise production collisions with normal keyboard controls
        run: npm run test:browser -- --project=desktop tests/browser/collision.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-webgl-contacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-screenshots-contacts
          path: test-results/**/*.png
          retention-days: 14
  journey:
    name: Continuous WebGL delivery journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install official Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Install Traditional Chinese screenshot fonts
        run: node tests/browser/install-ci-font.mjs
      - name: Run the unchanged continuous route with normal controls
        run: npm run test:browser -- --project=desktop tests/browser/quest.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-webgl-journey
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-screenshots-journey
          path: test-results/**/*.png
          retention-days: 14
  reference:
    name: Optional reference screenshots
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/install-ci-font.mjs
      - name: Capture public reference separately
        run: node tests/browser/reference-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taipei-ride-reference
          path: test-results/reference/
          retention-days: 14
