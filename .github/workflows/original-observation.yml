name: Observe original public game
on:
  push:
    branches: [observe-original-20261001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/install-ci-font.mjs
      - name: Capture public game with normal controls
        run: node tests/browser/reference-observe.mjs
      - name: Preserve observations even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-game-observation
          path: test-results/original-observation
          retention-days: 7
