name: Observe original short scenarios
on:
  push:
    branches: [observe-original-20261001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        scenario: [raf-tree, raf-light, raf-board]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/install-ci-font.mjs
      - name: Capture one normal-input scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: timeout --signal=TERM --kill-after=10s 9m node tests/browser/reference-inspect-scenario.mjs
      - name: Preserve already captured observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-${{ matrix.scenario }}
          path: test-results/original-${{ matrix.scenario }}
          retention-days: 7
